# Pinned foot 1.28 with the three Nostromo background-alpha actions.
[main]
shell=/usr/local/bin/oksh
font=Azeret Mono:size=11
font-italic=Azeret Mono:slant=italic:size=11
dpi-aware=no
term=foot
app-id=foot
title=nostromo
pad=10x10
initial-window-size-chars=100x30
initial-window-mode=windowed

[scrollback]
lines=10000

[colors-dark]
foreground=ffffff
background=000000
alpha=0.90
alpha-mode=default
cursor=000000 ffffff
selection-foreground=000000
selection-background=ffffff
regular0=000000
regular1=999999
regular2=bbbbbb
regular3=dddddd
regular4=aaaaaa
regular5=cccccc
regular6=eeeeee
regular7=ffffff
bright0=666666
bright1=aaaaaa
bright2=cccccc
bright3=eeeeee
bright4=bbbbbb
bright5=dddddd
bright6=eeeeee
bright7=ffffff

[csd]
preferred=server

[url]
launch=nostromo-browser ${url}

[key-bindings]
# Terminal actions use Ctrl+Shift, as other terminals do. Alt stays with the
# shell, whose emacs mode edits words with Alt+B/F/D/Y/U/L, except for the
# Mac-style Alt+C/V copy/paste and Alt+A/S opacity. Font size keeps foot's
# Ctrl+=/Ctrl+-/Ctrl+0.
clipboard-copy=Control+Shift+c Mod1+c XF86Copy
clipboard-paste=Control+Shift+v Mod1+v XF86Paste
scrollback-up-line=Control+Shift+k
scrollback-down-line=Control+Shift+j
scrollback-up-half-page=Control+Shift+u
scrollback-down-half-page=Control+Shift+d
scrollback-home=Shift+Home
scrollback-end=Shift+End
unicode-input=Control+Shift+i
alpha-decrease=Mod1+a
alpha-increase=Mod1+s
alpha-reset=Mod1+Shift+a
pipe-visible=[nostromo-line-picker] Control+Shift+l
pipe-scrollback=[nostromo-scrollback] Control+Shift+space
show-urls-launch=Control+Shift+o
show-urls-copy=Control+Shift+y
search-start=Control+Shift+f Control+Shift+r
