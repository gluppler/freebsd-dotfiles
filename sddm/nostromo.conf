[General]
DisplayServer=wayland
InputMethod=
GreeterEnvironment=QT_QPA_PLATFORM=wayland,LIBSEAT_BACKEND=seatd

[Theme]
Current=nostromo
Font=Michroma,14,-1,5,50,0,0,0,0,0
EnableAvatars=false

[Wayland]
