<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Michroma</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Azeret Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>Michroma</family><default><family>sans-serif</family></default></alias>
  <alias><family>Azeret Mono</family><default><family>monospace</family></default></alias>
</fontconfig>
