# Pinned foot 1.28 with the three Nostromo background-alpha actions.
[main]
shell=/usr/local/bin/oksh
font=Azeret Mono:size=11
font-italic=Azeret Mono:slant=italic:size=11
dpi-aware=no
term=foot
app-id=foot
title=nostromo
pad=10x10
initial-window-size-chars=100x30
initial-window-mode=windowed

[scrollback]
lines=10000

[colors-dark]
foreground=ffffff
background=000000
alpha=0.90
alpha-mode=default
cursor=000000 ffffff
selection-foreground=000000
selection-background=ffffff
regular0=000000
regular1=999999
regular2=bbbbbb
regular3=dddddd
regular4=aaaaaa
regular5=cccccc
regular6=eeeeee
regular7=ffffff
bright0=666666
bright1=aaaaaa
bright2=cccccc
bright3=eeeeee
bright4=bbbbbb
bright5=dddddd
bright6=eeeeee
bright7=ffffff

[csd]
preferred=server

[url]
launch=nostromo-browser ${url}

[key-bindings]
clipboard-copy=Mod1+c Control+Shift+c
clipboard-paste=Mod1+v Control+Shift+v
scrollback-up-line=Mod1+k
scrollback-down-line=Mod1+j
scrollback-up-half-page=Mod1+u
scrollback-down-half-page=Mod1+d
font-increase=Control+Shift+Up
font-decrease=Control+Shift+Down
font-reset=Control+Shift+Home
alpha-decrease=Mod1+a
alpha-increase=Mod1+s
alpha-reset=Mod1+Shift+a
pipe-visible=[nostromo-line-picker] Mod1+o
show-urls-launch=Mod1+l
show-urls-copy=Mod1+y
search-start=Control+Shift+r
