# Put machine-specific values in services.local; that file is not managed.
# Values are consumed by the shell scripts sourcing this file.
# shellcheck disable=SC2034
# Native FreeBSD WireGuard; private keys stay in root-owned host configuration.
WG_INTERFACE=wg0
# SERVER_HOST can be an existing SSH alias or user@reachable-host.
SERVER_HOST=
# An existing remote browser web UI, not discord.com itself.
DISCORD_URL=
