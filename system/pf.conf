# This anchor covers incoming traffic only. Replies to stateful outgoing traffic
# are handled by PF's state table. No packet logging/fingerprinting noise.
table <nostromo_ssh_peers> persist file "/usr/local/etc/nostromo/ssh-peers"
pass in quick inet proto udp from any port 67 to any port 68 keep state
pass in quick inet6 proto udp from fe80::/10 port 547 to any port 546 keep state
# Path MTU, reachability, router discovery and neighbour discovery.
pass in quick inet proto icmp icmp-type { unreach, timex, paramprob } keep state
pass in quick inet6 proto icmp6 icmp6-type { unreach, toobig, timex, paramprob, routersol, routeradv, neighbrsol, neighbradv } keep state
# Only explicitly enrolled tunnel peers may initiate SSH to this laptop.
pass in quick on nostromo_wg proto tcp from <nostromo_ssh_peers> to self port 2222 flags S/SA keep state
block drop in quick all
