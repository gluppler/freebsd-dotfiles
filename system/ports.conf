# Used only by the pinned build tree. Never replace /etc/make.conf.
CC=/usr/bin/clang
CXX=/usr/bin/clang++
CPP=/usr/bin/clang-cpp
DEFAULT_VERSIONS+= python=3.12 python3=3.12 ssl=base
OPTIONS_UNSET+=DOCS EXAMPLES
textproc_libxml2_UNSET=READLINE
textproc_libxslt_UNSET=CRYPTO
dns_libpsl_SET=ICU
dns_libpsl_UNSET=IDN IDN2
ftp_curl_UNSET=IDN GNUTLS
ftp_curl_SET=OPENSSL
print_cups_UNSET=AVAHI GNUTLS X11
print_cups_SET=OPENSSL
math_Imath_UNSET=PYTHON DOCS
multimedia_ffmpeg_UNSET=GMP GNUTLS SRT GCRYPT NVENC VDPAU
multimedia_ffmpeg_SET=OPENSSL VAAPI
x11-toolkits_wlroots020_UNSET=X11 VULKAN
x11-toolkits_wlroots020_SET=DRM OPENGL LCMS2 LIBLIFTOFF
textproc_fcitx5_UNSET=X11
textproc_fcitx5_SET=WAYLAND ENCHANT
security_py-ecdsa_UNSET=GMPY GMPY2
PKG_NOTES+=nostromo_recipe
# KiCad uses the shared SPICE engine, not the X11 command-line frontend.
.if !empty(.CURDIR:M*/cad/ngspice_rework)
FLAVOR=shlib
.endif
x11-toolkits_wxgtk32_UNSET=WEBKIT GSTREAMER MSPACK
x11-toolkits_wxgtk32_SET=NLS
graphics_poppler_UNSET=GNUPG
