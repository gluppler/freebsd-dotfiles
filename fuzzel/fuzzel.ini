[main]
font=Michroma:size=10.5
dpi-aware=no
terminal=foot -e
anchor=center
lines=12
minimal-lines=yes
line-height=24
horizontal-pad=24
vertical-pad=16
inner-pad=8
icons-enabled=no
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=000000e6
text=ffffffff
match=ffffffff
selection=ffffffff
selection-text=000000ff
selection-match=000000ff
border=ffffffff

[border]
width=2
radius=0

[key-bindings]
prev=Up Control+p Mod1+k
next=Down Control+n Mod1+j
cancel=Escape Control+g
